[project]
name = "photos"
version = "0.1.0"
description = "Personal raw photo workflow: cull, then edit."
requires-python = ">=3.10"
dependencies = [
    "moderngl>=5.13.0",
    "pillow>=10",
    "rawpy>=0.21",
]

[project.scripts]
photos = "photos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# RawNIND noise reduction (photos/neural.py): ONNX Runtime with CUDA and cuDNN from pip, ~2.5 GB,
# and onnx to convert the model to float16. Without it (--no-group neural) the editor's Neural
# toggle is greyed out.
neural = [
    "onnxruntime-gpu[cuda,cudnn]>=1.31; python_version >= '3.11' and sys_platform != 'darwin'",
    "onnx>=1.23.2; python_version >= '3.11' and sys_platform != 'darwin'",
]

[tool.uv]
default-groups = ["dev", "neural"]
